<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mi experiencia AR con modelo 3D</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #153451; color: white;
      font: 16px Arial; text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="aviso">Autoriza la cámara y apunta al código QR</div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="pocion" src="./pocion.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"
              look-controls="enabled: false"></a-camera>

    <a-entity id="objetivo" mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="modelo"
        src="#pocion"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-gltf-model>

      <a-box color="#168BCD"
             width="0.4" height="0.4" depth="0.4"
             position="0 0 0.2"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const aviso = document.getElementById("aviso");
    const objetivo = document.getElementById("objetivo");
    const modelo = document.getElementById("modelo");

    objetivo.addEventListener("targetFound", () => {
      aviso.textContent = "QR detectado";
    });
    objetivo.addEventListener("targetLost", () => {
      aviso.textContent = "QR perdido, apunta de nuevo";
    });
    modelo.addEventListener("model-loaded", () => {
      aviso.textContent = "Modelo cargado. Apunta al QR";
    });
    modelo.addEventListener("model-error", () => {
      aviso.textContent = "Error al cargar pocion.glb";
    });
  </script>
</body>
</html>
